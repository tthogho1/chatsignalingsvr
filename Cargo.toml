[package]
name = "websocket-chat-signaling-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenv = "0.15"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3.0"

[[example]]
name = "logging_demo"
path = "examples/logging_demo.rs"

[[example]]
name = "cli_demo"
path = "examples/cli_demo.rs"

[[example]]
name = "websocket_client"
path = "examples/websocket_client.rs"

# Client binary
[[bin]]
name = "client"
path = "src/bin/client.rs"

# WASM client library
[lib]
name = "websocket_chat_signaling_server"
crate-type = ["cdylib", "rlib"]