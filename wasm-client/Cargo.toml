[package]
name = "wasm-webrtc-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent",
  "BinaryType",
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcSdpType",
  "RtcTrackEvent",
  "RtcPeerConnectionIceEvent",
  "MediaDevices",
  "MediaStream",
  "MediaStreamTrack",
  "MediaStreamConstraints",
  "Navigator",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlVideoElement",
  "HtmlButtonElement",
  "HtmlInputElement",
  "Event",
  "EventTarget",
  "KeyboardEvent",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
gloo-utils = "0.2"
serde-wasm-bindgen = "0.6"

[dependencies.getrandom]
version = "0.2"
features = ["js"]